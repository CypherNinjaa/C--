<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360" role="img" aria-labelledby="title desc">
<title id="title">Repository commit history chart</title>
<desc id="desc">A repo-only X and Y axis chart showing daily commits from this repository history.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#0f172a"/>
<stop offset="65%" stop-color="#111827"/>
<stop offset="100%" stop-color="#18181b"/>
</linearGradient>
